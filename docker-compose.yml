services:

  #  SERVICE REDIS : Stockage temporaire des votes
  redis:
    image: redis:alpine # Image officielle légère
    restart: unless-stopped
    container_name: redis
    healthcheck: # Pour que les autres services puissent attendre Redis
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
    networks:
      - voting-network
    mem_limit: 128m
    # (Pas besoin de volumes pour un simple cache, sauf persistance explicite)

  #  SERVICE VOTE (Python) : Envoie les votes à Redis
  vote:
    image: vote
    container_name: vote
    ports:
      - "8080:8080" # Port d'accès à l'application
    restart: unless-stopped
    environment:
      # L'application utilisera le nom du service 'redis' pour se connecter
      REDIS_HOST: redis 
      # Les autres variables (OPTION_A, OPTION_B) peuvent être ajoutées ici
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
    networks:
      - voting-network
    mem_limit: 256m
    cpus: 0.25

  # SERVICE WORKER (.NET Core) : Lit depuis Redis et écrit dans PostgreSQL
  worker:
    image: worker
    restart: unless-stopped
    container_name: worker
    environment:
      # L'application utilisera 'db' et 'redis' comme noms d'hôtes
      DB_HOST: db 
      REDIS_HOST: redis
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
    networks:
      - voting-network
    mem_limit: 256m
    cpus: 0.25

  # SERVICE RESULT (Node.js) : Affiche les résultats
  result:
    image: result
    env_file:
      - .env.local.db # Contient les infos de connexion PostgreSQL
    container_name: result
    ports:
      - 8888:8888
    restart: unless-stopped
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
    networks:
      - voting-network
    mem_limit: 256m
    cpus: 0.25
  
  #  SERVICE DB (PostgreSQL) : Base de données permanente
  db:
    image: postgres:18-alpine
    restart: always
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
    env_file:
      - .env.local.db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 15s
      retries: 5
      timeout: 10s
    container_name: db
    mem_limit: 1g
    cpus: 1.0
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - voting-network


# Définition des Volumes
volumes:
  postgres_data:
  # redis_data: # Optionnel si vous souhaitez que les données Redis persistent

# Définition du Réseau pour l'isolation
networks:
  voting-network:
    driver: bridge