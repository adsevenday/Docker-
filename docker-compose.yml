services:

  #  SERVICE REDIS : Stockage temporaire des votes
  redis:
    image: redis:alpine # Image officielle légère
    healthcheck: # Pour que les autres services puissent attendre Redis
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 128m
    ports:
      - "6379:6379"
    networks:
      - voting-network
    # (Pas besoin de volumes pour un simple cache, sauf persistance explicite)

  #  SERVICE VOTE (Python) : Envoie les votes à Redis
  vote:
    image: vote
    ports:
      - "8080:8080" # Port d'accès à l'application
    environment:
      # L'application utilisera le nom du service 'redis' pour se connecter
      REDIS_HOST: redis 
      # Les autres variables (OPTION_A, OPTION_B) peuvent être ajoutées ici
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 256m
          cpus: '0.5'
        reservations:
          memory: 128m
          cpus: '0.25'
    networks:
      - voting-network



  # SERVICE WORKER (.NET Core) : Lit depuis Redis et écrit dans PostgreSQL
  worker:
    image: worker
    environment:
      # L'application utilisera 'db' et 'redis' comme noms d'hôtes
      DB_HOST: tasks.db 
      REDIS_HOST: tasks.redis
    deploy:
      placement:
        constraints:
          - node.role == manager
      replicas: 2
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 256m
          cpus: '0.5'
        reservations:
          memory: 128m
          cpus: '0.25'
    networks:
      - voting-network

  # SERVICE RESULT (Node.js) : Affiche les résultats
  result:
    image: result
    command: ["sh", "-c", "while ! nc -z db 5432; do sleep 1; done; python app.py"]
    env_file:
      - .env.local.db # Contient les infos de connexion PostgreSQL
    ports:
      - 8888:8888
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 256m
          cpus: '0.5'
        reservations:
          memory: 128m
          cpus: '0.25'
    networks:
      - voting-network
  
  #  SERVICE DB (PostgreSQL) : Base de données permanente
  db:
    image: postgres:18-alpine
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 256m
          cpus: '1'
        reservations:
          memory: 128m
          cpus: '0.5'
    env_file:
      - .env.local.db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 15s
      retries: 5
      timeout: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - voting-network




# Définition des Volumes
volumes:
  postgres_data:
  # redis_data: # Optionnel si vous souhaitez que les données Redis persistent

# Définition du Réseau pour l'isolation
networks:
  voting-network:
    driver: overlay
    attachable: true